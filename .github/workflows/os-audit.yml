name: Mumchies OS audit tests

on:
  push:
    branches:
      - audit/os-quality-20261021
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Full backend suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit_user
          POSTGRES_PASSWORD: audit_password_only
          POSTGRES_DB: mumchies_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit_user -d mumchies_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://audit_user:audit_password_only@localhost:5432/mumchies_audit
      AUTH_ENABLED: "false"
      DATA_DIR: ${{ runner.temp }}/mumchies-audit-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Test disposable database migrations
        run: alembic upgrade head
      - name: Run entire backend test suite
        run: python -m pytest -q tests

  frontend-test:
    name: Full frontend suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
