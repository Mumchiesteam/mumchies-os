<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mumchies AI Support Preview</title><style>body{font:15px system-ui;background:#e5ddd5;margin:0}main{max-width:640px;margin:auto;background:#fafafa;min-height:100vh;display:flex;flex-direction:column}header{background:#075e54;color:white;padding:18px}small{opacity:.8}#chat{flex:1;padding:18px;min-height:55vh}article{padding:12px;margin:10px 0;border-radius:12px;max-width:80%;white-space:pre-wrap;background:white}article.user{background:#dcf8c6;margin-left:auto}footer{display:flex;padding:12px;gap:8px;background:#eee}input{flex:1;padding:12px;border:1px solid #aaa;border-radius:8px}button{background:#075e54;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer}button:disabled{opacity:.5}#status{font-size:12px;color:#444;padding:8px 18px}</style></head><body><main><header><strong>Mumchies AI Support</strong><div><small>Private preview · No WhatsApp messages sent</small></div></header><div id="status">AI status will appear after the first message.</div><div id="chat"><article>Hi! I'm the Mumchies AI test assistant. What would you like to know?</article></div><footer><input id="message" placeholder="Ask about Gond Laddu, gifting, delivery..." maxlength="2000"><button id="send">Send</button><button id="reset" title="New conversation">Reset</button></footer></main><script>const history=[];const chat=document.querySelector('#chat'),input=document.querySelector('#message'),send=document.querySelector('#send'),status=document.querySelector('#status');function bubble(t,who){const a=document.createElement('article');a.className=who;a.textContent=t;chat.append(a);a.scrollIntoView({block:'end'});}async function submit(){const m=input.value.trim();if(!m||send.disabled)return;input.value='';bubble(m,'user');send.disabled=true;status.textContent='Waiting for response…';try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,history:history.slice(-16)})});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();bubble(data.reply||'No reply','assistant');history.push({role:'user',content:m},{role:'assistant',content:data.reply||'No reply'});status.textContent=data.ai_used?'Answered by OpenAI':'AI unavailable / handover';}catch(e){bubble('Request failed: '+e.message,'assistant');status.textContent='Connection error';}finally{send.disabled=false;input.focus()}}send.onclick=submit;input.onkeydown=e=>{if(e.key==='Enter')submit()};document.querySelector('#reset').onclick=()=>{history.length=0;chat.innerHTML='';bubble('New test conversation started.','assistant');status.textContent='History cleared'};</script></body></html>
