databases:
  - name: mumchies-os-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    databaseName: mumchies_os
    user: mumchies
    ipAllowList: []

services:
  - type: web
    name: mumchies-os-api
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: mumchies-os-db
          property: connectionString
      - key: DATA_DIR
        value: /var/data/mumchies
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_ENABLED
        value: true
      - key: AUTH_ADMIN_USERNAME
        sync: false
      - key: AUTH_ADMIN_PASSWORD_HASH
        sync: false
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: AUTH_SESSION_MINUTES
        value: 480
      - key: AUTH_COOKIE_SECURE
        value: true
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: SHOPIFY_STORE
        sync: false
      - key: SHOPIFY_STORE_URL
        sync: false
      - key: SHOPIFY_TOKEN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        sync: false
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_PICKUP
        sync: false
      - key: DELHIVERY_TOKEN
        sync: false
      - key: DELHIVERY_PICKUP
        sync: false
      - key: SHADOWFAX_TOKEN
        sync: false
      - key: SHADOWFAX_EMAIL
        sync: false
      - key: SHADOWFAX_PASSWORD_SECRET
        sync: false
      - key: SHADOWFAX_BASE_URL
        sync: false
      - key: GDRIVE_FOLDER_ID
        sync: false
      - key: GDRIVE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: NDR_INGEST_TOKEN
        sync: false
      - key: SHIPMENT_TRACKING_POLLER_ENABLED
        value: true
      - key: SHIPMENT_TRACKING_POLL_INTERVAL_SECONDS
        value: 7200
      - key: SHIPMENT_TRACKING_POLL_BATCH_SIZE
        value: 50
      - key: SHIPMENT_TRACKING_POLL_SPACING_SECONDS
        value: 1.0
      - key: SHADOWFAX_TRACKING_POLL_ENABLED
        value: false
    disk:
      name: mumchies-os-data
      mountPath: /var/data/mumchies
      sizeGB: 1

  - type: web
    name: mumchies-os-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
